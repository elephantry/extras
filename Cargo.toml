[package]
name = "elephantry-extras"
version = "0.11.0"
authors = ["Sanpi <sanpi@homecomputing.fr>"]
edition = "2024"
description = "A collection of additional components for elephantry."
license = "MIT"
repository = "https://github.com/elephantry/extras/"

[dependencies.askama]
version = "0.16"
optional = true

[dependencies.elephantry]
version = "5.0"
optional = true

[dependencies.salvo]
version = "0.96"
default-features = false
optional = true

[dependencies.serde]
version = "1.0"
features = ["derive"]
optional = true

[dependencies.tera]
version = "2.0"
optional = true

[dependencies.yew]
version = "0.23"
optional = true

[features]
default = []
askama-pager = ["askama", "elephantry"]
salvo = ["dep:salvo", "serde"]
tera-pager = ["tera", "serde"]
yew-pager = ["yew"]
